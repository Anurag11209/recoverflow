services:
  db:
    image: postgres:17
    container_name: recoverflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoverflow
      POSTGRES_PASSWORD: recoverflow
      POSTGRES_DB: recoverflow
    ports:
      - '5432:5432'
    volumes:
      - recoverflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recoverflow -d recoverflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recoverflow_pgdata:
