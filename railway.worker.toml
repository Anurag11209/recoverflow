# Railway config-as-code for the RecoverFlow WORKER service.
# This is a SECOND Railway service in the same project as the web app, sharing the
# same PostgreSQL. Set this file as the service's Config File path
# (/railway.worker.toml). Builder: Railpack (auto-installs workspace deps).
#
# The worker has no HTTP server, so there is NO healthcheck path. Database
# migrations are owned by the web service's release phase — do NOT run them here
# (two services racing on `prisma migrate deploy` is unsafe). Deploy web (which
# applies migrations) before the worker.

[build]
# Generate the Prisma client. The worker runs its TypeScript directly via tsx
# (workspace packages are consumed as source), so there is no separate compile.
buildCommand = "pnpm db:generate"

[deploy]
# Long-running worker process. Handles SIGTERM for a graceful drain on redeploy.
startCommand = "pnpm --filter @recoverflow/worker start"

# Restart on crash, capped so a crash-loop surfaces instead of hiding.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Only rebuild when code affecting the worker changes.
watchPatterns = [
  "apps/worker/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "turbo.json",
  "railway.worker.toml",
]
