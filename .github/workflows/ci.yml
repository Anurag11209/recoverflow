name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Used by main-process steps (e.g. prisma generate). NOT inherited by
      # next build's page-data workers — see the "Write .env for build" step.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/recoverflow?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Write .env for build
        # next build re-evaluates next.config.ts inside page-data workers, which
        # load the repo-root .env via dotenv. This is how DATABASE_URL reaches
        # those workers (job-level env vars are not forwarded into them). The
        # build never opens a DB connection, so placeholder values are safe.
        run: |
          cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/recoverflow?schema=public
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ENVEOF

      - name: Build
        run: pnpm build
